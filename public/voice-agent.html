<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce Sommelier-gent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            font-family: 'Georgia', serif;
            color: #e8dcc8;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(120,40,60,0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(60,20,80,0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(30,15,50,0.4) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 24px 20px 12px;
        }

        .header h1 {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #c9a96e;
            text-transform: uppercase;
        }

        .header .subtitle {
            font-size: 0.75rem;
            color: rgba(200,170,130,0.5);
            letter-spacing: 0.2em;
            margin-top: 4px;
        }

        .main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            overflow: hidden;
        }

        .conversation {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: rgba(201,169,110,0.2) transparent;
        }

        .conversation::-webkit-scrollbar { width: 4px; }
        .conversation::-webkit-scrollbar-track { background: transparent; }
        .conversation::-webkit-scrollbar-thumb { background: rgba(201,169,110,0.2); border-radius: 2px; }

        .bubble {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 0.95rem;
            animation: bubbleIn 0.25s ease-out;
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .bubble.agent {
            background: rgba(201,169,110,0.12);
            border: 1px solid rgba(201,169,110,0.2);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #e8dcc8;
        }

        .bubble.user {
            background: rgba(120,60,160,0.25);
            border: 1px solid rgba(160,90,200,0.25);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: #e8dcc8;
        }

        .bubble .speaker {
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 4px;
        }

        .transcript-preview {
            min-height: 22px;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(201,169,110,0.6);
            font-style: italic;
            padding: 2px 0 6px;
            letter-spacing: 0.03em;
        }

        .controls {
            padding: 12px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            color: rgba(201,169,110,0.6);
            min-height: 20px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(201,169,110,0.4);
            transition: background 0.3s;
        }

        .status-dot.listening  { background: #e05060; animation: pulse 1s infinite; }
        .status-dot.processing { background: #e0a030; animation: pulse 0.6s infinite; }
        .status-dot.speaking   { background: #40c080; animation: pulse 0.8s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.5; transform: scale(0.8); }
        }

        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(201,169,110,0.4);
            background: rgba(201,169,110,0.08);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            position: relative;
            flex-shrink: 0;
        }

        .mic-btn:hover   { border-color: rgba(201,169,110,0.7); background: rgba(201,169,110,0.14); }
        .mic-btn:active,
        .mic-btn.active  { border-color: #e05060; background: rgba(224,80,96,0.18); transform: scale(0.96); }
        .mic-btn.speaking-state   { border-color: #40c080; background: rgba(64,192,128,0.12); cursor: default; }
        .mic-btn.processing-state { border-color: #e0a030; background: rgba(224,160,48,0.12); cursor: default; }

        .mic-btn svg { width: 32px; height: 32px; fill: rgba(201,169,110,0.8); transition: fill 0.2s; }
        .mic-btn.active svg          { fill: #e05060; }
        .mic-btn.speaking-state svg  { fill: #40c080; }
        .mic-btn.processing-state svg { fill: #e0a030; }

        .mic-btn::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(224,80,96,0);
            transition: border-color 0.3s;
        }

        .mic-btn.active::before {
            border-color: rgba(224,80,96,0.4);
            animation: ring 1.2s ease-out infinite;
        }

        @keyframes ring {
            0%   { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .waveform { display: flex; align-items: center; gap: 3px; height: 32px; }
        .wave-bar { width: 3px; border-radius: 2px; background: #40c080; animation: wave 0.8s ease-in-out infinite; }
        .wave-bar:nth-child(1) { height: 10px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 20px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 28px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 20px; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 10px; animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50%       { transform: scaleY(0.4); }
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(224,160,48,0.2);
            border-top-color: #e0a030;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .text-row { display: flex; width: 100%; gap: 10px; align-items: flex-end; }

        .text-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(201,169,110,0.2);
            border-radius: 24px;
            padding: 10px 18px;
            color: #e8dcc8;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            min-height: 42px;
            max-height: 100px;
            line-height: 1.4;
        }

        .text-input::placeholder { color: rgba(201,169,110,0.35); }
        .text-input:focus         { border-color: rgba(201,169,110,0.5); }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(201,169,110,0.3);
            background: rgba(201,169,110,0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .send-btn:hover { background: rgba(201,169,110,0.2); border-color: rgba(201,169,110,0.6); }
        .send-btn svg   { width: 18px; height: 18px; fill: rgba(201,169,110,0.8); }

        .hint {
            font-size: 0.7rem;
            color: rgba(201,169,110,0.3);
            letter-spacing: 0.1em;
            text-align: center;
        }

        .thinking-bubble { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(201,169,110,0.5);
            animation: bounce 1.2s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
            40%            { transform: translateY(-6px); opacity: 1; }
        }

        /* Widget host — rendered in the viewport (opacity:0) so the iframe
           gets a proper rendering context. off-screen causes ESW_APP_READY_EVENT
           RPC timeouts which prevent onEmbeddedMessagingReady from ever firing. */
        #sf-widget-host {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 420px;
            height: 680px;
            opacity: 0;
            pointer-events: none;
            z-index: 5;  /* behind our voice UI (z-index 10) but rendered */
        }

        /* Suppress any widget chrome that renders outside our host div */
        .embeddedMessagingConversationButton,
        .embeddedServiceHelpButton,
        [id^="embedded-messaging"],
        [class*="embeddedMessagingMinimizedBubble"] {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Salesforce Embedded Messaging widget (hidden, live) -->
    <div id="sf-widget-host"></div>

    <!-- Voice UI -->
    <div class="bg"></div>

    <div class="header">
        <h1>Somm&aelig;lier-gent</h1>
        <div class="subtitle">Your personal wine advisor</div>
    </div>

    <div class="main">
        <div class="conversation" id="conversation"></div>
        <div class="transcript-preview" id="transcriptPreview"></div>

        <div class="controls">
            <div class="status-bar">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting to your sommelier...</span>
            </div>

            <button class="mic-btn" id="micBtn" title="Tap to speak" disabled>
                <svg id="micIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-2 16.93A8.001 8.001 0 0 1 4.07 11H6.1a6 6 0 0 0 11.8 0h2.03A8.001 8.001 0 0 1 14 17.93V21h3v2H7v-2h3v-3.07z"/>
                </svg>
                <div class="waveform" id="waveform" style="display:none">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                <div class="spinner" id="spinner" style="display:none"></div>
            </button>

            <div class="hint">tap to speak &nbsp;&bull;&nbsp; type below</div>

            <div class="text-row">
                <textarea
                    class="text-input"
                    id="textInput"
                    placeholder="Type a question about wine..."
                    rows="1"
                ></textarea>
                <button class="send-btn" id="sendBtn" title="Send">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ── Salesforce Embedded Messaging bootstrap ────────────────────────── -->
    <script>
    'use strict';

    var sfWidget = {
        ready: false,
        chatOpen: false,
        // Queued pending-response resolver
        _pendingResolve: null,
        _pendingTimer: null,
        // Message snapshot for change-detection fallback
        _lastAgentMsgText: '',
        _seenMsgCount: 0,
        _initialGreetingDone: false,
        _greetingResolve: null,
        // Streaming token buffer (agent streams tokens before final Message fires)
        _streamBuffer: '',
    };

    /* ── Intercept window.dispatchEvent before widget loads ─────────────
         The SF SCRT2 widget fires custom events via window.dispatchEvent().
         By overriding it here (before bootstrap.min.js runs) we catch every
         event the widget dispatches — regardless of its name — and try to
         extract agent message text from the event detail.                  */
    (function () {
        var _orig = window.dispatchEvent.bind(window);
        window.dispatchEvent = function (event) {
            try {
                if (event && event.type) {
                    var t = event.type.toLowerCase();
                    if (t.includes('embedded') || t.includes('messag') ||
                        t.includes('chat')     || t.includes('agent') || t.includes('bot')) {
                        var detail = event.detail || {};
                        console.log('[VA] dispatchEvent:', event.type,
                                    JSON.stringify(detail).substring(0, 400));

                        // ── onEmbeddedMessageSent — primary response channel ──
                        // The widget streams agent responses token-by-token and
                        // then fires a final Message entry with the complete text.
                        // detail.conversationEntry.entryPayload is a JSON string.
                        if (event.type === 'onEmbeddedMessageSent' && detail.conversationEntry) {
                            var entry = detail.conversationEntry;
                            var rawPayload = entry.entryPayload;
                            if (rawPayload) {
                                try {
                                    var payload = JSON.parse(rawPayload);

                                    // Collect streaming tokens for a fast-path fallback
                                    if (payload.entryType === 'StreamingToken') {
                                        var token =
                                            payload.token ||
                                            (payload.streamingToken && payload.streamingToken.token) || '';
                                        if (token) {
                                            sfWidget._streamBuffer =
                                                (sfWidget._streamBuffer || '') + token;
                                        }
                                    }

                                    // Final assembled Message — this is what we want to speak
                                    if (payload.entryType === 'Message' && payload.abstractMessage) {
                                        var abMsg = payload.abstractMessage;
                                        var role   = (abMsg.role || abMsg.sender || '').toLowerCase();
                                        var text   =
                                            (abMsg.staticContent && abMsg.staticContent.text) ||
                                            (abMsg.textBody    && abMsg.textBody.text)          || '';

                                        if (text && text.length > 5 && role !== 'enduser') {
                                            console.log('[VA] Agent reply via Message:', text.substring(0, 120));
                                            sfWidget._streamBuffer = ''; // clear buffer
                                            _resolveAgentResponse(text.trim());
                                        }
                                    }
                                } catch (parseErr) {
                                    console.warn('[VA] entryPayload parse error:', parseErr);
                                }
                            }
                            return _orig(event);
                        }

                        // ── Generic fallback: look for text in top-level fields ──
                        var text =
                            detail.text ||
                            detail.message ||
                            (detail.body && detail.body.text) ||
                            (detail.payload && detail.payload.text);

                        if (text && typeof text === 'string' && text.trim().length > 5) {
                            console.log('[VA] Message via dispatchEvent:', event.type,
                                        text.substring(0, 120));
                            _resolveAgentResponse(text.trim());
                        }
                    }
                }
            } catch (ignore) {}
            return _orig(event);
        };
    })();

    /* ── Explicit listeners for every known SCRT2 event name ──────────── */
    [
        'embeddedMessagingNewMessage',
        'onEmbeddedMessagingNewMessage',
        'embeddedMessagingConversationItemAdded',
        'onEmbeddedMessagingConversationItemAdded',
        'embeddedMessagingAgentMessage',
        'onEmbeddedMessagingAgentMessage'
    ].forEach(function (name) {
        window.addEventListener(name, function (ev) {
            var d = ev.detail || {};
            console.log('[VA] Named event:', name, JSON.stringify(d).substring(0, 400));
            var text = d.text || d.message ||
                       (d.body && d.body.text) ||
                       (d.payload && d.payload.text) ||
                       (d.conversationEntry &&
                        d.conversationEntry.entryPayload &&
                        d.conversationEntry.entryPayload.abstractMessage &&
                        d.conversationEntry.entryPayload.abstractMessage.text);
            if (text && typeof text === 'string' && text.trim().length > 5) {
                _resolveAgentResponse(text.trim());
            }
        });
    });

    /* ── Kick off the widget ─────────────────────────────────────────── */
    function initEmbeddedMessaging() {
        try {
            var host = document.getElementById('sf-widget-host');
            if (host && window.embeddedservice_bootstrap) {
                embeddedservice_bootstrap.settings.targetElement = host;
            }
            embeddedservice_bootstrap.settings.language = 'en_US';
            embeddedservice_bootstrap.init(
                '00DHu00000izUN6',
                'SommalierGent_1',
                'https://storm-11c5bf736713cf.my.site.com/ESWSommalierGent1762152842517',
                { scrt2URL: 'https://storm-11c5bf736713cf.my.salesforce-scrt.com' }
            );
        } catch (err) {
            console.error('[VA] Widget init error:', err);
        }
    }

    window.addEventListener('onEmbeddedMessagingReady', function () {
        sfWidget.ready = true;
        console.log('[VA] Widget ready');

        setTimeout(function () {
            try {
                if (window.embeddedservice_bootstrap &&
                    embeddedservice_bootstrap.utilAPI &&
                    embeddedservice_bootstrap.utilAPI.launchChat) {
                    embeddedservice_bootstrap.utilAPI.launchChat();
                    sfWidget.chatOpen = true;
                    console.log('[VA] Chat launched');
                    _startResponseMonitor();
                }
            } catch (e) {
                console.warn('[VA] launchChat error:', e);
            }
        }, 800);
    });

    /* ── Listen for any postMessages from the SF widget iframe ──────── */
    window.addEventListener('message', function (ev) {
        try {
            var d = ev.data;
            if (!d || typeof d !== 'object') return;

            // Log for debugging (only short messages)
            var s = JSON.stringify(d);
            if (s.length < 600) console.log('[VA] postMsg:', s);

            // Extract agent-text from known SF SCRT2 message shapes
            var text = _extractAgentText(d);
            if (text) {
                console.log('[VA] Agent reply via postMessage:', text.substring(0, 120));
                _resolveAgentResponse(text);
            }
        } catch (ignore) {}
    });

    function _extractAgentText(d) {
        // SF SCRT2 fires various shapes — check the common ones
        var candidates = [];

        // Shape: { method: 'messageReceived', payload: { text: '...' } }
        if (d.method === 'messageReceived' && d.payload) {
            var p = d.payload;
            candidates.push(p.text, p.message, p.body, p.content);
        }

        // Shape: { type/event, message/text/body }
        if (d.type === 'AGENT_MESSAGE' || d.type === 'BOT_MESSAGE' ||
            d.type === 'agentMessage'   || d.type === 'botMessage'  ||
            d.event === 'onNewMessage') {
            candidates.push(d.text, d.message, d.body, d.content,
                            d.payload && d.payload.text);
        }

        // Catch-all: top-level string fields that look like content
        ['agentResponse','botResponse','reply','response','content','text','message']
            .forEach(function(k){ if (typeof d[k] === 'string') candidates.push(d[k]); });

        return candidates.find(function(c){
            return typeof c === 'string' && c.trim().length > 15;
        }) || null;
    }

    /* ── MutationObserver fallback — watches widget iframe DOM ──────── */
    function _startResponseMonitor() {
        var host = document.getElementById('sf-widget-host');
        if (!host) return;

        var observer = new MutationObserver(function () {
            _checkIframeForNewMessages();
        });

        // Observe host for iframe insertion and subtree changes
        observer.observe(host, { childList: true, subtree: true, characterData: true });
        // Also observe body in case SF renders its sidebar outside our host
        observer.observe(document.body, { childList: true });

        console.log('[VA] Response monitor started');
    }

    function _checkIframeForNewMessages() {
        // Try to find the SF iframe
        var iframe = document.querySelector('#sf-widget-host iframe') ||
                     document.querySelector('iframe[class*="embedded"], iframe[id*="embedded"]') ||
                     document.querySelector('.embeddedServiceSidebar iframe');

        if (iframe) {
            try {
                // Same-origin attempt
                var doc = iframe.contentDocument || iframe.contentWindow.document;
                var msgEls = doc.querySelectorAll(
                    '[class*="message"],[class*="Message"],[role="article"],' +
                    '[class*="bubble"],[class*="Bubble"],[class*="chatMessage"]'
                );

                if (msgEls.length > sfWidget._seenMsgCount) {
                    for (var i = sfWidget._seenMsgCount; i < msgEls.length; i++) {
                        var el = msgEls[i];
                        var txt = (el.textContent || '').trim();

                        // Skip if it looks like a user message
                        var isUser = el.classList.contains('user') ||
                                     el.classList.contains('sent') ||
                                     el.classList.contains('outgoing') ||
                                     !!el.closest('[class*="outbound"], [class*="outgoing"], [class*="user-msg"]');

                        if (!isUser && txt.length > 15 && txt !== sfWidget._lastAgentMsgText) {
                            sfWidget._lastAgentMsgText = txt;
                            sfWidget._seenMsgCount = msgEls.length;
                            console.log('[VA] Agent reply via iframe DOM:', txt.substring(0, 120));
                            _resolveAgentResponse(txt);
                            return;
                        }
                    }
                    sfWidget._seenMsgCount = msgEls.length;
                }
            } catch (crossOriginErr) {
                // Cross-origin: fall back to sidebar text diff
                _checkSidebarTextDiff();
            }
        } else {
            _checkSidebarTextDiff();
        }
    }

    function _checkSidebarTextDiff() {
        var sidebar = document.querySelector('.embeddedServiceSidebar') ||
                      document.querySelector('[class*="embedded-messaging"]') ||
                      document.getElementById('sf-widget-host');
        if (!sidebar) return;

        var current = (sidebar.textContent || '').trim();
        if (current.length > sfWidget._lastAgentMsgText.length + 30) {
            var delta = current.substring(sfWidget._lastAgentMsgText.length).trim();
            delta = _cleanWidgetChrome(delta);
            if (delta && delta.length > 20) {
                sfWidget._lastAgentMsgText = current;
                console.log('[VA] Agent reply via sidebar diff:', delta.substring(0, 120));
                _resolveAgentResponse(delta);
            }
        }
    }

    function _cleanWidgetChrome(text) {
        // Strip common SF widget UI strings
        var uiChromeStrings = [
            'Type a message', 'Send', 'Minimize', 'Close', 'End Chat',
            'Loading', 'Attach File', 'Emoji', 'Start Over'
        ];
        uiChromeStrings.forEach(function (s) {
            text = text.replace(new RegExp('\\b' + s + '\\b', 'gi'), '');
        });
        return text.replace(/\s+/g, ' ').trim();
    }

    /* ── Public: send text to widget ───────────────────────────────── */
    function sfSendMessage(text) {
        return new Promise(function (resolve) {
            // Method 1 — utilAPI.sendTextMessage (SF SCRT2 v58+)
            if (window.embeddedservice_bootstrap &&
                embeddedservice_bootstrap.utilAPI &&
                typeof embeddedservice_bootstrap.utilAPI.sendTextMessage === 'function') {
                try {
                    const result = embeddedservice_bootstrap.utilAPI.sendTextMessage(text);
                    // Catch async rejection (fires when widget isn't ready yet)
                    if (result && typeof result.catch === 'function') {
                        result.catch(function (e) {
                            console.warn('[VA] sendTextMessage async rejection:', e.message || e);
                            // Abort the pending response wait so we fail fast
                            if (sfWidget._pendingResolve) {
                                clearTimeout(sfWidget._pendingTimer);
                                var res = sfWidget._pendingResolve;
                                sfWidget._pendingResolve = null;
                                sfWidget._pendingTimer = null;
                                res(null);
                            }
                        });
                    }
                    console.log('[VA] Sent via utilAPI.sendTextMessage');
                    resolve(true);
                    return;
                } catch (e) {
                    console.warn('[VA] utilAPI.sendTextMessage failed:', e);
                }
            }

            // Method 2 — inject into the widget's iframe input field
            var iframes = Array.from(document.querySelectorAll('iframe'));
            var sfIframe = iframes.find(function (f) {
                return (f.src || '').match(/salesforce|force\.com|my\.site\.com|scrt/i);
            }) || document.querySelector('#sf-widget-host iframe');

            if (sfIframe) {
                try {
                    var doc = sfIframe.contentDocument || sfIframe.contentWindow.document;
                    var inputEl = doc.querySelector('input[type="text"], textarea, [contenteditable="true"], [role="textbox"]');

                    if (inputEl) {
                        // React-friendly native setter
                        try {
                            var proto = Object.getPrototypeOf(inputEl);
                            var descriptor = Object.getOwnPropertyDescriptor(proto, 'value');
                            if (descriptor && descriptor.set) descriptor.set.call(inputEl, text);
                            else inputEl.value = text;
                        } catch (e) { inputEl.value = text; }

                        ['focus','input','change'].forEach(function (type) {
                            inputEl.dispatchEvent(new Event(type, { bubbles: true }));
                        });

                        setTimeout(function () {
                            var btn = doc.querySelector(
                                'button[type="submit"], [aria-label*="Send" i], [title*="Send" i], button[class*="send" i]'
                            );
                            if (btn) {
                                btn.click();
                            } else {
                                ['keydown','keypress','keyup'].forEach(function (t) {
                                    inputEl.dispatchEvent(new KeyboardEvent(t, {
                                        key: 'Enter', code: 'Enter', keyCode: 13,
                                        which: 13, bubbles: true, cancelable: true
                                    }));
                                });
                            }
                            resolve(true);
                        }, 350);
                        return;
                    }
                } catch (crossOriginErr) {
                    console.warn('[VA] Cross-origin iframe — trying postMessage');
                    sfIframe.contentWindow.postMessage(
                        { type: 'sendMessage', action: 'send', message: text, text: text }, '*'
                    );
                    resolve(true);
                    return;
                }
            }

            console.warn('[VA] Could not find SF widget to send message');
            resolve(false);
        });
    }

    /* ── Public: wait for next agent response ───────────────────────── */
    function sfWaitForResponse(timeoutMs) {
        return new Promise(function (resolve) {
            sfWidget._pendingResolve = resolve;
            sfWidget._pendingTimer = setTimeout(function () {
                if (sfWidget._pendingResolve) {
                    sfWidget._pendingResolve = null;
                    resolve(null);
                }
            }, timeoutMs || 30000);
        });
    }

    function _resolveAgentResponse(text) {
        // Don't resolve the same text twice in quick succession
        if (text === sfWidget._lastResolvedText) return;
        sfWidget._lastResolvedText = text;

        if (sfWidget._pendingResolve) {
            clearTimeout(sfWidget._pendingTimer);
            var res = sfWidget._pendingResolve;
            sfWidget._pendingResolve = null;
            sfWidget._pendingTimer = null;
            res(text);
        } else if (!sfWidget._initialGreetingDone) {
            sfWidget._initialGreetingDone = true;
            if (sfWidget._greetingResolve) {
                var gr = sfWidget._greetingResolve;
                sfWidget._greetingResolve = null;
                gr(text);
            }
        }
    }

    function sfWaitForGreeting(timeoutMs) {
        return new Promise(function (resolve) {
            if (sfWidget._initialGreetingDone) { resolve(null); return; }
            sfWidget._greetingResolve = resolve;
            setTimeout(function () {
                if (sfWidget._greetingResolve) {
                    sfWidget._greetingResolve = null;
                    resolve(null);
                }
            }, timeoutMs || 12000);
        });
    }

    <script src="https://storm-11c5bf736713cf.my.site.com/ESWSommalierGent1762152842517/assets/js/bootstrap.min.js"
            onload="initEmbeddedMessaging()"></script>

    <!-- ── Voice interaction ─────────────────────────────────────────────── -->
    <script>
    (function () {
        'use strict';

        const VOICE = 'nova';
        const FALLBACK_GREETING = 'Hello, and welcome to the Agentforce Sommelier-gent experience. I\'d love to pair you with the perfect wine. To get started, please tell me your name, title, and company.';

        let mediaRecorder = null;
        let audioChunks   = [];
        let isRecording   = false;
        let isSpeaking    = false;
        let isProcessing  = false;
        let currentAudio  = null;
        let recognition   = null;
        let useBrowserSTT = false;
        let greetingSpoken = false;

        const conversationEl   = document.getElementById('conversation');
        const micBtn           = document.getElementById('micBtn');
        const micIcon          = document.getElementById('micIcon');
        const waveformEl       = document.getElementById('waveform');
        const spinnerEl        = document.getElementById('spinner');
        const statusDot        = document.getElementById('statusDot');
        const statusText       = document.getElementById('statusText');
        const transcriptPreview = document.getElementById('transcriptPreview');
        const textInputEl      = document.getElementById('textInput');
        const sendBtnEl        = document.getElementById('sendBtn');

        /* ── UI helpers ──────────────────────────────────────────────── */
        function setStatus(state, text) {
            statusDot.className = 'status-dot ' + (state || '');
            statusText.textContent = text;
        }

        function setMicState(state) {
            micBtn.className = 'mic-btn';
            micIcon.style.display  = 'block';
            waveformEl.style.display = 'none';
            spinnerEl.style.display  = 'none';

            if (state === 'listening') {
                micBtn.classList.add('active');
            } else if (state === 'speaking') {
                micBtn.classList.add('speaking-state');
                micIcon.style.display   = 'none';
                waveformEl.style.display = 'flex';
            } else if (state === 'processing') {
                micBtn.classList.add('processing-state');
                micIcon.style.display  = 'none';
                spinnerEl.style.display = 'block';
            }
        }

        function addBubble(role, text) {
            const wrap = document.createElement('div');
            wrap.className = 'bubble ' + role;

            const label = document.createElement('div');
            label.className = 'speaker';
            label.textContent = role === 'agent' ? 'Sommelier' : 'You';

            const content = document.createElement('div');
            content.textContent = text;

            wrap.appendChild(label);
            wrap.appendChild(content);
            conversationEl.appendChild(wrap);
            conversationEl.scrollTop = conversationEl.scrollHeight;
        }

        function showThinking() {
            const wrap = document.createElement('div');
            wrap.className = 'bubble agent thinking-bubble';
            wrap.id = 'thinkingBubble';
            for (let i = 0; i < 3; i++) {
                const d = document.createElement('div');
                d.className = 'dot';
                wrap.appendChild(d);
            }
            conversationEl.appendChild(wrap);
            conversationEl.scrollTop = conversationEl.scrollHeight;
        }

        function removeThinking() {
            const el = document.getElementById('thinkingBubble');
            if (el) el.remove();
        }

        /* ── TTS (OpenAI Nova) ───────────────────────────────────────── */
        async function speak(text) {
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            isSpeaking = true;
            setMicState('speaking');
            setStatus('speaking', 'Speaking...');

            try {
                const res = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voice: VOICE })
                });

                if (!res.ok) throw new Error('TTS request failed: ' + res.status);

                const blob = await res.blob();
                const url  = URL.createObjectURL(blob);
                currentAudio = new Audio(url);

                await new Promise((resolve, reject) => {
                    currentAudio.onended = resolve;
                    currentAudio.onerror = reject;
                    currentAudio.play().catch(reject);
                });

                URL.revokeObjectURL(url);
            } catch (err) {
                console.warn('[VA] TTS error, falling back to browser synthesis:', err);
                await new Promise(resolve => {
                    const utt = new SpeechSynthesisUtterance(text);
                    utt.rate  = 0.95;
                    utt.pitch = 1;
                    utt.onend = resolve;
                    window.speechSynthesis.speak(utt);
                });
            } finally {
                currentAudio = null;
                isSpeaking   = false;
                setMicState('');
                setStatus('', 'Tap the mic to speak, or type below');
            }
        }

        /* ── Send to agent ───────────────────────────────────────────── */
        async function sendToAgent(message) {
            isProcessing = true;
            micBtn.disabled = true;
            setMicState('processing');
            setStatus('processing', 'Thinking...');
            showThinking();

            let reply = null;

            try {
                sfWidget._streamBuffer = ''; // clear any previous tokens
                // Primary: use the live SF embedded widget
                const sent = await sfSendMessage(message);

                if (sent) {
                    reply = await sfWaitForResponse(30000);
                    if (reply) console.log('[VA] Got reply from widget:', reply.substring(0, 80));

                    // If the final Message entry was missed but streaming tokens were collected
                    if (!reply && sfWidget._streamBuffer && sfWidget._streamBuffer.length > 20) {
                        reply = sfWidget._streamBuffer.trim();
                        sfWidget._streamBuffer = '';
                        console.log('[VA] Using streamed token buffer as reply:', reply.substring(0, 80));
                    }
                }

                // Fallback: Agentforce REST API (in case it gets enabled later)
                if (!reply) {
                    console.log('[VA] Widget did not respond; trying REST API fallback…');
                    const res = await fetch('/api/agentforce-chat', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message })
                    });
                    const data = await res.json();
                    reply = data.response || null;
                }
            } catch (err) {
                console.error('[VA] sendToAgent error:', err);
            }

            removeThinking();

            const responseText = reply || "I'm having a little trouble connecting right now. Please try again in a moment.";
            addBubble('agent', responseText);
            isProcessing = false;
            micBtn.disabled = false;

            await speak(responseText);
        }

        /* ── Speech recognition (Whisper preferred, browser fallback) ─ */
        function initBrowserSTT() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return false;

            recognition = new SR();
            recognition.continuous    = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (e) => {
                let interim = '', final = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const t = e.results[i][0].transcript;
                    if (e.results[i].isFinal) final += t;
                    else interim += t;
                }
                transcriptPreview.textContent = final || interim;
                if (final) { stopRecording(); handleTranscript(final.trim()); }
            };

            recognition.onerror = () => { stopRecording(); setStatus('', 'Tap the mic to speak, or type below'); };
            recognition.onend   = () => { if (isRecording) stopRecording(); };

            return true;
        }

        async function startRecording() {
            if (isSpeaking || isProcessing) return;
            isRecording = true;
            transcriptPreview.textContent = '';
            setMicState('listening');
            setStatus('listening', 'Listening…');

            if (useBrowserSTT && recognition) {
                try { recognition.start(); return; } catch (e) { /* fall through */ }
            }

            // MediaRecorder → Whisper
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks  = [];

                const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                    ? 'audio/webm;codecs=opus'
                    : 'audio/webm';

                mediaRecorder = new MediaRecorder(stream, { mimeType });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    await transcribeAndSend();
                };
                mediaRecorder.start();
            } catch (err) {
                console.error('[VA] Mic access error:', err);
                isRecording = false;
                setStatus('', 'Microphone access denied — please allow microphone access');
                setMicState('');
            }
        }

        function stopRecording() {
            if (!isRecording) return;
            isRecording = false;
            micBtn.classList.remove('active');

            if (useBrowserSTT && recognition) {
                try { recognition.stop(); } catch (e) {}
                return;
            }

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        async function transcribeAndSend() {
            if (audioChunks.length === 0) {
                setStatus('', 'Tap the mic to speak, or type below');
                setMicState('');
                return;
            }

            setMicState('processing');
            setStatus('processing', 'Transcribing…');

            try {
                const blob   = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                const base64 = await new Promise((resolve, reject) => {
                    reader.onload  = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });

                const res  = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ audio: base64 })
                });
                const data = await res.json();
                const transcript = data.text?.trim();

                transcriptPreview.textContent = '';

                if (transcript) {
                    handleTranscript(transcript);
                } else {
                    setStatus('', "I didn't catch that — please try again");
                    setMicState('');
                }
            } catch (err) {
                console.error('[VA] Transcription error:', err);
                setStatus('', 'Transcription failed — please try again');
                setMicState('');
            }
        }

        function handleTranscript(text) {
            transcriptPreview.textContent = '';
            addBubble('user', text);
            sendToAgent(text);
        }

        /* ── Mic button — consolidated tap handler ──────────────────── */
        let holdTimer = null;
        let savedGreeting = FALLBACK_GREETING; // updated after init resolves

        // All mic activation routes funnel through here
        async function handleMicActivation() {
            // Very first tap: speak the greeting (unlocks browser audio context)
            if (!greetingSpoken) {
                greetingSpoken = true;
                setStatus('speaking', 'Playing greeting…');
                await speak(savedGreeting);
                setStatus('', 'Tap the mic to speak, or type below');
                return;
            }

            if (isSpeaking) {
                // Interrupt current speech and go straight to listening
                if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                isSpeaking = false;
            }

            if (isProcessing) return;

            if (isRecording) stopRecording();
            else             startRecording();
        }

        micBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (micBtn.disabled) return;
            // Only start hold-timer after greeting has been spoken
            if (greetingSpoken && !isSpeaking && !isProcessing) {
                holdTimer = setTimeout(() => startRecording(), 80);
            }
        });

        micBtn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            clearTimeout(holdTimer);
            // Let the click event drive the logic so we don't double-fire
        });

        micBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (micBtn.disabled) return;
            handleMicActivation();
        });

        /* ── Text input ──────────────────────────────────────────────── */
        function submitText() {
            const msg = textInputEl.value.trim();
            if (!msg || isProcessing) return;
            textInputEl.value = '';
            textInputEl.style.height = 'auto';
            if (isSpeaking && currentAudio) { currentAudio.pause(); isSpeaking = false; }
            addBubble('user', msg);
            sendToAgent(msg);
        }

        sendBtnEl.addEventListener('click', submitText);

        textInputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitText(); }
        });

        textInputEl.addEventListener('input', () => {
            textInputEl.style.height = 'auto';
            textInputEl.style.height = Math.min(textInputEl.scrollHeight, 100) + 'px';
        });

        /* ── Initialise ──────────────────────────────────────────────── */
        async function init() {
            useBrowserSTT = initBrowserSTT();
            setStatus('', 'Connecting to your sommelier…');

            // Wait up to 20 s for the SF widget to fully initialize
            await new Promise(resolve => {
                let waited = 0;
                const check = setInterval(() => {
                    waited += 200;
                    if (sfWidget.ready || sfWidget.chatOpen || waited >= 20000) {
                        clearInterval(check);
                        resolve();
                    }
                }, 200);
            });

            // Try to capture the real agent greeting from the widget
            // (the widget fires its opening message shortly after chat is launched)
            const widgetGreeting = await sfWaitForGreeting(10000);
            const greeting = widgetGreeting || FALLBACK_GREETING;

            addBubble('agent', greeting);
            savedGreeting = greeting; // mic handler will speak this on first tap

            micBtn.disabled = false;
            setStatus('', 'Tap the mic to hear your greeting from Nova');
        }

        init();
    })();
    </script>
