<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salesforce Sommelier-gent</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0a0f;
            font-family: 'Georgia', serif;
            color: #e8dcc8;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Background */
        .bg {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(120, 40, 60, 0.25) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(60, 20, 80, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(30, 15, 50, 0.4) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Header */
        .header {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 24px 20px 12px;
        }

        .header h1 {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #c9a96e;
            text-transform: uppercase;
        }

        .header .subtitle {
            font-size: 0.75rem;
            color: rgba(200, 170, 130, 0.5);
            letter-spacing: 0.2em;
            margin-top: 4px;
        }

        /* Main layout */
        .main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 0 16px;
            overflow: hidden;
        }

        /* Conversation area */
        .conversation {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scrollbar-width: thin;
            scrollbar-color: rgba(201, 169, 110, 0.2) transparent;
        }

        .conversation::-webkit-scrollbar {
            width: 4px;
        }
        .conversation::-webkit-scrollbar-track { background: transparent; }
        .conversation::-webkit-scrollbar-thumb {
            background: rgba(201, 169, 110, 0.2);
            border-radius: 2px;
        }

        .bubble {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 0.95rem;
            animation: bubbleIn 0.25s ease-out;
        }

        @keyframes bubbleIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .bubble.agent {
            background: rgba(201, 169, 110, 0.12);
            border: 1px solid rgba(201, 169, 110, 0.2);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: #e8dcc8;
        }

        .bubble.user {
            background: rgba(120, 60, 160, 0.25);
            border: 1px solid rgba(160, 90, 200, 0.25);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: #e8dcc8;
        }

        .bubble .speaker {
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 4px;
        }

        /* Transcript preview */
        .transcript-preview {
            min-height: 22px;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(201, 169, 110, 0.6);
            font-style: italic;
            padding: 2px 0 6px;
            letter-spacing: 0.03em;
        }

        /* Controls */
        .controls {
            padding: 12px 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* Status bar */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
            color: rgba(201, 169, 110, 0.6);
            min-height: 20px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(201, 169, 110, 0.4);
            transition: background 0.3s;
        }

        .status-dot.listening { background: #e05060; animation: pulse 1s infinite; }
        .status-dot.processing { background: #e0a030; animation: pulse 0.6s infinite; }
        .status-dot.speaking { background: #40c080; animation: pulse 0.8s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Mic button */
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid rgba(201, 169, 110, 0.4);
            background: rgba(201, 169, 110, 0.08);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            position: relative;
            flex-shrink: 0;
        }

        .mic-btn:hover {
            border-color: rgba(201, 169, 110, 0.7);
            background: rgba(201, 169, 110, 0.14);
        }

        .mic-btn:active, .mic-btn.active {
            border-color: #e05060;
            background: rgba(224, 80, 96, 0.18);
            transform: scale(0.96);
        }

        .mic-btn.speaking-state {
            border-color: #40c080;
            background: rgba(64, 192, 128, 0.12);
            cursor: default;
        }

        .mic-btn.processing-state {
            border-color: #e0a030;
            background: rgba(224, 160, 48, 0.12);
            cursor: default;
        }

        .mic-btn svg {
            width: 32px;
            height: 32px;
            fill: rgba(201, 169, 110, 0.8);
            transition: fill 0.2s;
        }

        .mic-btn.active svg { fill: #e05060; }
        .mic-btn.speaking-state svg { fill: #40c080; }
        .mic-btn.processing-state svg { fill: #e0a030; }

        /* Ring animation when listening */
        .mic-btn::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid rgba(224, 80, 96, 0);
            transition: border-color 0.3s;
        }

        .mic-btn.active::before {
            border-color: rgba(224, 80, 96, 0.4);
            animation: ring 1.2s ease-out infinite;
        }

        @keyframes ring {
            0%   { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* Waveform for speaking state */
        .waveform {
            display: flex;
            align-items: center;
            gap: 3px;
            height: 32px;
        }

        .wave-bar {
            width: 3px;
            border-radius: 2px;
            background: #40c080;
            animation: wave 0.8s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { height: 10px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 20px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 28px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 20px; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 10px; animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(1); }
            50%       { transform: scaleY(0.4); }
        }

        /* Spinner */
        .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid rgba(224, 160, 48, 0.2);
            border-top-color: #e0a030;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Text input row */
        .text-row {
            display: flex;
            width: 100%;
            gap: 10px;
            align-items: flex-end;
        }

        .text-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(201, 169, 110, 0.2);
            border-radius: 24px;
            padding: 10px 18px;
            color: #e8dcc8;
            font-family: 'Georgia', serif;
            font-size: 0.9rem;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            min-height: 42px;
            max-height: 100px;
            line-height: 1.4;
        }

        .text-input::placeholder { color: rgba(201, 169, 110, 0.35); }
        .text-input:focus { border-color: rgba(201, 169, 110, 0.5); }

        .send-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(201, 169, 110, 0.3);
            background: rgba(201, 169, 110, 0.1);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .send-btn:hover {
            background: rgba(201, 169, 110, 0.2);
            border-color: rgba(201, 169, 110, 0.6);
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: rgba(201, 169, 110, 0.8);
        }

        /* Divider hint */
        .hint {
            font-size: 0.7rem;
            color: rgba(201, 169, 110, 0.3);
            letter-spacing: 0.1em;
            text-align: center;
        }

        /* Loading dots for agent thinking */
        .thinking-bubble {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 14px 18px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(201, 169, 110, 0.5);
            animation: bounce 1.2s ease-in-out infinite;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
            40%            { transform: translateY(-6px); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg"></div>

    <div class="header">
        <h1>Somm&aelig;lier-gent</h1>
        <div class="subtitle">Your personal wine advisor</div>
    </div>

    <div class="main">
        <div class="conversation" id="conversation"></div>

        <div class="transcript-preview" id="transcriptPreview"></div>

        <div class="controls">
            <div class="status-bar">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Initializing your sommelier...</span>
            </div>

            <button class="mic-btn" id="micBtn" title="Hold to speak" disabled>
                <svg id="micIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-2 16.93A8.001 8.001 0 0 1 4.07 11H6.1a6 6 0 0 0 11.8 0h2.03A8.001 8.001 0 0 1 14 17.93V21h3v2H7v-2h3v-3.07z"/>
                </svg>
                <div class="waveform" id="waveform" style="display:none">
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                    <div class="wave-bar"></div>
                </div>
                <div class="spinner" id="spinner" style="display:none"></div>
            </button>

            <div class="hint">tap to speak &nbsp;&bull;&nbsp; type below</div>

            <div class="text-row">
                <textarea
                    class="text-input"
                    id="textInput"
                    placeholder="Type a question about wine..."
                    rows="1"
                ></textarea>
                <button class="send-btn" id="sendBtn" title="Send">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        const VOICE = 'nova';
        const FALLBACK_GREETING = "Hello and welcome to the Agentforce Sommelier-gent Experience! We would love to pair you with the perfect wine. Please tell me your name, title and company so we can get started.";

        let conversationId = null;
        let sequenceId = 1;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let isSpeaking = false;
        let isProcessing = false;
        let currentAudio = null;
        let recognition = null;
        let useBrowserSTT = false;

        const conversationEl = document.getElementById('conversation');
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const waveform = document.getElementById('waveform');
        const spinner = document.getElementById('spinner');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const transcriptPreview = document.getElementById('transcriptPreview');
        const textInput = document.getElementById('textInput');
        const sendBtn = document.getElementById('sendBtn');

        // ── State helpers ──────────────────────────────────────────────────────
        function setStatus(state, text) {
            statusDot.className = 'status-dot ' + (state || '');
            statusText.textContent = text;
        }

        function setMicState(state) {
            micBtn.className = 'mic-btn';
            micIcon.style.display = 'block';
            waveform.style.display = 'none';
            spinner.style.display = 'none';

            if (state === 'listening') {
                micBtn.classList.add('active');
            } else if (state === 'speaking') {
                micBtn.classList.add('speaking-state');
                micIcon.style.display = 'none';
                waveform.style.display = 'flex';
            } else if (state === 'processing') {
                micBtn.classList.add('processing-state');
                micIcon.style.display = 'none';
                spinner.style.display = 'block';
            }
        }

        // ── Conversation bubbles ───────────────────────────────────────────────
        function addBubble(role, text) {
            const wrap = document.createElement('div');
            wrap.className = 'bubble ' + role;
            const label = document.createElement('div');
            label.className = 'speaker';
            label.textContent = role === 'agent' ? 'Sommelier' : 'You';
            const content = document.createElement('div');
            content.textContent = text;
            wrap.appendChild(label);
            wrap.appendChild(content);
            conversationEl.appendChild(wrap);
            conversationEl.scrollTop = conversationEl.scrollHeight;
            return wrap;
        }

        function showThinking() {
            const wrap = document.createElement('div');
            wrap.className = 'bubble agent thinking-bubble';
            wrap.id = 'thinkingBubble';
            for (let i = 0; i < 3; i++) {
                const d = document.createElement('div');
                d.className = 'dot';
                wrap.appendChild(d);
            }
            conversationEl.appendChild(wrap);
            conversationEl.scrollTop = conversationEl.scrollHeight;
        }

        function removeThinking() {
            const el = document.getElementById('thinkingBubble');
            if (el) el.remove();
        }

        // ── TTS ────────────────────────────────────────────────────────────────
        async function speak(text) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            isSpeaking = true;
            setMicState('speaking');
            setStatus('speaking', 'Speaking...');

            try {
                const res = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text, voice: VOICE })
                });

                if (!res.ok) throw new Error('TTS failed');

                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                currentAudio = new Audio(url);

                await new Promise((resolve, reject) => {
                    currentAudio.onended = resolve;
                    currentAudio.onerror = reject;
                    currentAudio.play().catch(reject);
                });
            } catch (err) {
                console.warn('TTS error, falling back to browser synthesis:', err);
                await browserSpeak(text);
            } finally {
                URL.revokeObjectURL(currentAudio?.src);
                currentAudio = null;
                isSpeaking = false;
                setMicState('idle');
                setStatus('', 'Tap the mic to speak, or type below');
            }
        }

        function browserSpeak(text) {
            return new Promise(resolve => {
                const utt = new SpeechSynthesisUtterance(text);
                utt.rate = 0.95;
                utt.pitch = 1;
                utt.onend = resolve;
                window.speechSynthesis.speak(utt);
            });
        }

        // ── Agentforce chat ────────────────────────────────────────────────────
        async function sendToAgent(message) {
            isProcessing = true;
            micBtn.disabled = true;
            setMicState('processing');
            setStatus('processing', 'Thinking...');
            showThinking();

            sequenceId++;

            try {
                const res = await fetch('/api/agentforce-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, conversationId, sequenceId })
                });

                const data = await res.json();
                removeThinking();

                if (data.conversationId) conversationId = data.conversationId;

                const reply = data.response || data.error || 'I apologize, I could not process that request.';
                addBubble('agent', reply);
                isProcessing = false;
                micBtn.disabled = false;

                await speak(reply);
            } catch (err) {
                removeThinking();
                console.error('Agent error:', err);
                const errMsg = 'I seem to be having trouble connecting. Please try again.';
                addBubble('agent', errMsg);
                isProcessing = false;
                micBtn.disabled = false;
                await speak(errMsg);
            }
        }

        // ── Speech recognition / recording ─────────────────────────────────────
        function initBrowserSTT() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return false;
            recognition = new SR();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onresult = (e) => {
                let interim = '';
                let final = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const t = e.results[i][0].transcript;
                    if (e.results[i].isFinal) final += t;
                    else interim += t;
                }
                transcriptPreview.textContent = final || interim;
                if (final) {
                    stopRecording();
                    handleTranscript(final.trim());
                }
            };

            recognition.onerror = (e) => {
                console.warn('STT error:', e.error);
                stopRecording();
                setStatus('', 'Tap the mic to speak, or type below');
            };

            recognition.onend = () => {
                if (isRecording) stopRecording();
            };

            return true;
        }

        async function startRecording() {
            if (isSpeaking || isProcessing) return;
            isRecording = true;
            transcriptPreview.textContent = '';
            setMicState('listening');
            setStatus('listening', 'Listening...');

            if (useBrowserSTT && recognition) {
                try { recognition.start(); return; } catch(e) { /* fall through */ }
            }

            // MediaRecorder path (Whisper)
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
                    ? 'audio/webm;codecs=opus'
                    : 'audio/webm';
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    await transcribeAndSend();
                };
                mediaRecorder.start();
            } catch (err) {
                console.error('Mic access error:', err);
                isRecording = false;
                setStatus('', 'Microphone access denied');
                setMicState('idle');
            }
        }

        function stopRecording() {
            if (!isRecording) return;
            isRecording = false;
            micBtn.classList.remove('active');

            if (useBrowserSTT && recognition) {
                try { recognition.stop(); } catch(e) {}
                return;
            }

            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
        }

        async function transcribeAndSend() {
            if (audioChunks.length === 0) {
                setStatus('', 'Tap the mic to speak, or type below');
                setMicState('idle');
                return;
            }

            setMicState('processing');
            setStatus('processing', 'Transcribing...');

            try {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const reader = new FileReader();
                const base64 = await new Promise((resolve, reject) => {
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });

                const res = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ audio: base64 })
                });

                const data = await res.json();
                const transcript = data.text?.trim();
                transcriptPreview.textContent = '';

                if (transcript) {
                    handleTranscript(transcript);
                } else {
                    setStatus('', "I didn't catch that. Try again.");
                    setMicState('idle');
                }
            } catch (err) {
                console.error('Transcription error:', err);
                setStatus('', 'Transcription failed. Please try again.');
                setMicState('idle');
            }
        }

        function handleTranscript(text) {
            transcriptPreview.textContent = '';
            addBubble('user', text);
            sendToAgent(text);
        }

        // ── Mic button events ──────────────────────────────────────────────────
        let holdTimer = null;
        let tapMode = false;

        micBtn.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (isSpeaking || isProcessing) return;
            holdTimer = setTimeout(() => {
                tapMode = false;
                startRecording();
            }, 80);
        });

        micBtn.addEventListener('pointerup', (e) => {
            e.preventDefault();
            clearTimeout(holdTimer);
            if (isRecording && !tapMode) {
                stopRecording();
            } else if (!isRecording && !isSpeaking && !isProcessing) {
                tapMode = true;
                if (!isRecording) startRecording();
                else stopRecording();
            }
        });

        micBtn.addEventListener('click', (e) => {
            e.preventDefault();
            if (!isRecording && !isSpeaking && !isProcessing) {
                tapMode = true;
                startRecording();
            } else if (isRecording) {
                stopRecording();
            }
        });

        // ── Text input ─────────────────────────────────────────────────────────
        function submitText() {
            const msg = textInput.value.trim();
            if (!msg || isProcessing) return;
            textInput.value = '';
            textInput.style.height = 'auto';
            if (isSpeaking && currentAudio) { currentAudio.pause(); isSpeaking = false; }
            addBubble('user', msg);
            sendToAgent(msg);
        }

        sendBtn.addEventListener('click', submitText);

        textInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitText();
            }
        });

        textInput.addEventListener('input', () => {
            textInput.style.height = 'auto';
            textInput.style.height = Math.min(textInput.scrollHeight, 100) + 'px';
        });

        // ── Init ───────────────────────────────────────────────────────────────
        async function init() {
            useBrowserSTT = initBrowserSTT();
            setStatus('', 'Connecting to your sommelier...');

            try {
                const res = await fetch('/api/agentforce-init', { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                const data = await res.json();

                if (data.sessionId) conversationId = data.sessionId;

                const greeting = data.greeting || FALLBACK_GREETING;
                addBubble('agent', greeting);
                await speak(greeting);
            } catch (err) {
                console.warn('Init failed, using fallback greeting:', err);
                addBubble('agent', FALLBACK_GREETING);
                await speak(FALLBACK_GREETING);
            }

            micBtn.disabled = false;
            setStatus('', 'Tap the mic to speak, or type below');
        }

        init();
    })();
    </script>
</body>
</html>
